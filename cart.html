<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Shopping Bag — AURA</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <link rel="stylesheet" href="css/style.css">
</head>
<body class="bg-[#FCFCFA]">

  <!-- Header -->
  <header class="glass-nav border-b border-neutral-100">
    <div class="max-w-7xl mx-auto px-4 h-20 flex items-center justify-between">
      <a href="shop.html" class="text-xs uppercase tracking-widest text-neutral-600 hover:text-neutral-900">← Continue Shopping</a>
      <a href="index.html" class="font-serif text-3xl tracking-[0.25em] text-neutral-900">A U R A</a>
      <div class="text-xs uppercase tracking-widest text-neutral-400 font-semibold">Secure SSL 256-bit</div>
    </div>
  </header>

  <div class="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8 py-12">
    <h1 class="font-serif text-3xl sm:text-4xl text-neutral-900 mb-8 font-light">Shopping Bag Overview</h1>

    <div class="grid grid-cols-1 lg:grid-cols-3 gap-12">
      <!-- Items Container -->
      <div class="lg:col-span-2 space-y-6" id="cart-items-container">
        <!-- Rendered via renderCartPage() in app.js -->
      </div>

      <!-- Order Summary Card -->
      <div class="bg-white p-8 border border-neutral-200 h-fit space-y-6 shadow-xs">
        <h3 class="font-serif text-xl text-neutral-900 border-b border-neutral-100 pb-4">Order Summary</h3>
        <div class="space-y-3 text-xs">
          <div class="flex justify-between text-neutral-600">
            <span>Subtotal</span>
            <span id="page-subtotal" class="font-semibold text-neutral-900">$0.00</span>
          </div>
          <div class="flex justify-between text-neutral-600">
            <span>Estimated Shipping</span>
            <span id="page-shipping" class="text-emerald-700 font-medium">Complimentary</span>
          </div>
          <div class="flex justify-between text-neutral-600">
            <span>Promo Discount (<span id="discount-code-name">None</span>)</span>
            <span id="page-discount" class="text-neutral-900">-$0.00</span>
          </div>
          <div class="border-t border-neutral-100 pt-4 flex justify-between text-sm font-bold text-neutral-900">
            <span>Estimated Total</span>
            <span id="page-total">$0.00</span>
          </div>
        </div>

        <!-- Promo Form -->
        <div class="flex gap-2">
          <input type="text" id="coupon-input" placeholder="Promo code (e.g. AURA10)" class="flex-1 border border-neutral-300 px-3 py-2 text-xs uppercase focus:outline-none focus:border-neutral-900" />
          <button onclick="applyCoupon()" class="px-4 py-2 bg-neutral-900 text-white text-xs uppercase font-semibold tracking-wider hover:bg-[#C5A880]">Apply</button>
        </div>

        <button onclick="showToast('Connecting with encrypted payment gateway...');" class="w-full py-4 bg-neutral-900 text-white text-xs uppercase tracking-widest font-semibold hover:bg-[#C5A880] transition-colors">
          Proceed to Checkout
        </button>
      </div>
    </div>
  </div>

  <script src="js/products.js"></script>
  <script src="js/apps.js"></script>
  <script>
    let promoDiscountPercent = 0;

    function renderCartPage() {
      const container = document.getElementById('cart-items-container');
      if (!container) return;

      if (State.cart.length === 0) {
        container.innerHTML = `
          <div class="p-12 text-center bg-white border border-neutral-100">
            <p class="font-serif text-2xl text-neutral-400 italic mb-4">Your bag is currently empty</p>
            <a href="shop.html" class="inline-block px-8 py-3 bg-neutral-900 text-white text-xs uppercase tracking-widest font-semibold hover:bg-[#C5A880]">Explore Our Shop</a>
          </div>
        `;
        updateCalculations();
        return;
      }

      container.innerHTML = State.cart.map((item, idx) => `
        <div class="flex flex-col sm:flex-row items-center gap-6 p-6 bg-white border border-neutral-100">
          <img src="${item.image}" alt="${item.name}" class="w-24 h-32 object-cover bg-neutral-100" />
          <div class="flex-1 space-y-1 text-center sm:text-left">
            <span class="text-[10px] uppercase tracking-widest text-[#C5A880] font-semibold">${item.category}</span>
            <h4 class="font-serif text-lg text-neutral-900">${item.name}</h4>
            <p class="text-xs text-neutral-500">Size: <span class="font-semibold text-neutral-700">${item.size}</span> | Color: <span class="font-semibold text-neutral-700">${item.color}</span></p>
            <p class="text-xs font-semibold text-neutral-900 mt-2">$${item.price.toFixed(2)}</p>
          </div>
          <div class="flex items-center gap-6">
            <div class="flex items-center border border-neutral-200">
              <button onclick="State.updateQuantity(${idx}, ${item.quantity - 1})" class="px-3 py-1 text-neutral-600 hover:bg-neutral-100">-</button>
              <span class="px-3 text-xs font-semibold">${item.quantity}</span>
              <button onclick="State.updateQuantity(${idx}, ${item.quantity + 1})" class="px-3 py-1 text-neutral-600 hover:bg-neutral-100">+</button>
            </div>
            <span class="text-sm font-semibold text-neutral-900 w-20 text-right">$${(item.price * item.quantity).toFixed(2)}</span>
            <button onclick="State.removeFromCart(${idx})" class="text-neutral-400 hover:text-red-500 p-2">✕</button>
          </div>
        </div>
      `).join('');

      updateCalculations();
    }

    function applyCoupon() {
      const code = document.getElementById('coupon-input').value.trim().toUpperCase();
      if (code === 'AURA10') {
        promoDiscountPercent = 0.10;
        document.getElementById('discount-code-name').textContent = 'AURA10 (10%)';
        showToast('10% discount promo applied successfully!');
      } else {
        showToast('Invalid coupon code.');
      }
      updateCalculations();
    }

    function updateCalculations() {
      const subtotal = State.getCartTotal();
      const discount = subtotal * promoDiscountPercent;
      const total = Math.max(0, subtotal - discount);

      document.getElementById('page-subtotal').textContent = `$${subtotal.toFixed(2)}`;
      document.getElementById('page-discount').textContent = `-$${discount.toFixed(2)}`;
      document.getElementById('page-total').textContent = `$${total.toFixed(2)}`;
    }
  </script>
</body>
</html>
