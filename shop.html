<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>The Catalog — AURA</title>
  <!-- Tailwind CSS CDN -->
  <script src="https://cdn.tailwindcss.com"></script>
  <link rel="stylesheet" href="css/styles.css">
</head>
<body class="bg-[#FCFCFA] text-neutral-900 antialiased">

  <!-- Top Announcement -->
  <div class="bg-neutral-900 text-white text-[11px] uppercase tracking-widest py-2 text-center">
    Enjoy complimentary worldwide delivery on all seasonal catalog purchases.
  </div>

  <!-- Header Navigation -->
  <header class="sticky top-0 z-40 glass-nav border-b border-neutral-100">
    <div class="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8">
      <div class="flex items-center justify-between h-20">
        <nav class="hidden lg:flex items-center gap-8">
          <a href="index.html" class="text-xs uppercase tracking-widest font-medium text-neutral-600 hover:text-neutral-900 transition-colors">Home</a>
          <a href="shop.html" class="text-xs uppercase tracking-widest font-semibold text-neutral-900 border-b-2 border-neutral-900 pb-1">Shop</a>
          <a href="about.html" class="text-xs uppercase tracking-widest font-medium text-neutral-600 hover:text-neutral-900 transition-colors">About</a>
          <a href="contact.html" class="text-xs uppercase tracking-widest font-medium text-neutral-600 hover:text-neutral-900 transition-colors">Contact</a>
        </nav>
        
        <a href="index.html" class="text-center group">
          <span class="font-serif text-3xl sm:text-4xl tracking-[0.25em] font-normal text-neutral-900">A U R A</span>
        </a>

        <div class="flex items-center gap-5">
          <button onclick="toggleSearchModal(true)" class="text-neutral-800 hover:text-[#C5A880] transition-colors" title="Search">
            <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="1.5" d="M21 21l-6-6m2-5a7 7 0 11-14 0 7 7 0 0114 0z"/></svg>
          </button>
          
          <a href="wishlist.html" class="relative text-neutral-800 hover:text-[#C5A880] transition-colors" title="Wishlist">
            <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="1.5" d="M4.318 6.318a4.5 4.5 0 000 6.364L12 20.364l7.682-7.682a4.5 4.5 0 00-6.364-6.364L12 7.636l-1.318-1.318a4.5 4.5 0 00-6.364 0z" /></svg>
            <span class="wishlist-badge-count absolute -top-2 -right-2 bg-neutral-900 text-white text-[9px] font-bold w-4 h-4 rounded-full flex items-center justify-center hidden">0</span>
          </a>

          <button onclick="openCartDrawer()" class="relative text-neutral-800 hover:text-[#C5A880] transition-colors" title="Shopping Bag">
            <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="1.5" d="M16 11V7a4 4 0 00-8 0v4M5 9h14l1 12H4L5 9z" /></svg>
            <span class="cart-badge-count absolute -top-2 -right-2 bg-[#C5A880] text-white text-[9px] font-bold w-4 h-4 rounded-full flex items-center justify-center hidden">0</span>
          </button>
        </div>
      </div>
    </div>
  </header>

  <!-- Page Title Banner -->
  <div class="bg-[#F6F4EE] py-12 border-b border-neutral-200">
    <div class="max-w-7xl mx-auto px-4 text-center">
      <span class="text-xs uppercase tracking-widest text-[#C5A880] font-semibold">The Permanent Collection</span>
      <h1 class="font-serif text-4xl sm:text-5xl text-neutral-900 mt-2 font-light">All Garments & Objects</h1>
    </div>
  </div>

  <!-- Shop Main Container -->
  <div class="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8 py-12">
    <div class="flex flex-col lg:flex-row gap-10">
      
      <!-- Filters Sidebar -->
      <aside class="w-full lg:w-64 shrink-0 space-y-8">
        <div>
          <h3 class="text-xs uppercase tracking-widest font-bold text-neutral-900 border-b border-neutral-200 pb-3 mb-4">Category</h3>
          <div class="space-y-3 text-xs">
            <label class="flex items-center gap-2.5 cursor-pointer hover:text-[#C5A880]">
              <input type="radio" name="shop-category" value="all" checked onchange="filterShop()" class="accent-neutral-900" />
              <span>All Categories</span>
            </label>
            <label class="flex items-center gap-2.5 cursor-pointer hover:text-[#C5A880]">
              <input type="radio" name="shop-category" value="women" onchange="filterShop()" class="accent-neutral-900" />
              <span>Women's Ready-to-Wear (10)</span>
            </label>
            <label class="flex items-center gap-2.5 cursor-pointer hover:text-[#C5A880]">
              <input type="radio" name="shop-category" value="men" onchange="filterShop()" class="accent-neutral-900" />
              <span>Men's Tailoring (10)</span>
            </label>
            <label class="flex items-center gap-2.5 cursor-pointer hover:text-[#C5A880]">
              <input type="radio" name="shop-category" value="accessories" onchange="filterShop()" class="accent-neutral-900" />
              <span>Leather Accessories (10)</span>
            </label>
            <label class="flex items-center gap-2.5 cursor-pointer hover:text-[#C5A880]">
              <input type="radio" name="shop-category" value="footwear" onchange="filterShop()" class="accent-neutral-900" />
              <span>Footwear & Boots (10)</span>
            </label>
          </div>
        </div>

        <div>
          <div class="flex justify-between items-center border-b border-neutral-200 pb-3 mb-4">
            <h3 class="text-xs uppercase tracking-widest font-bold text-neutral-900">Max Price</h3>
            <span class="text-xs font-semibold text-neutral-900">$<span id="price-val">600</span></span>
          </div>
          <input 
            type="range" 
            id="price-range-slider" 
            min="90" 
            max="600" 
            step="10" 
            value="600" 
            oninput="document.getElementById('price-val').textContent = this.value; filterShop();"
            class="w-full accent-neutral-900 cursor-pointer"
          />
        </div>

        <div>
          <button onclick="resetFilters()" class="w-full py-3 border border-neutral-900 text-neutral-900 text-xs font-semibold uppercase tracking-widest hover:bg-neutral-900 hover:text-white transition-colors">
            Reset Filters
          </button>
        </div>
      </aside>

      <!-- Products Grid & Sort Header -->
      <main class="flex-1">
        <div class="flex flex-col sm:flex-row items-center justify-between pb-6 border-b border-neutral-200 mb-8 gap-4">
          <p class="text-xs text-neutral-500 font-medium">Showing <span id="product-count" class="font-bold text-neutral-900">0</span> items</p>
          <div class="flex items-center gap-3">
            <label for="shop-sort" class="text-xs uppercase tracking-wider text-neutral-500">Sort By:</label>
            <select id="shop-sort" onchange="filterShop()" class="text-xs bg-white border border-neutral-300 py-2 px-3 focus:outline-none focus:border-neutral-900 cursor-pointer">
              <option value="featured">Featured First</option>
              <option value="price-low">Price: Low to High</option>
              <option value="price-high">Price: High to Low</option>
              <option value="rating">Top Rated</option>
            </select>
          </div>
        </div>

        <!-- The Products Grid -->
        <div id="shop-products-grid" class="grid grid-cols-1 sm:grid-cols-2 lg:grid-cols-3 gap-6 min-h-[400px]">
          <!-- Populated instantly by script -->
        </div>
      </main>

    </div>
  </div>

  <!-- Load Scripts -->
  <script src="js/products.js"></script>
  <script src="js/app.js"></script>
  
  <script>
    // Independent render function ensuring immediate display
    function filterShop() {
      if (typeof AURA_PRODUCTS === 'undefined' || !Array.isArray(AURA_PRODUCTS)) {
        console.error('AURA_PRODUCTS database not loaded.');
        return;
      }

      const selectedCategory = document.querySelector('input[name="shop-category"]:checked')?.value || 'all';
      const maxPrice = parseFloat(document.getElementById('price-range-slider')?.value || 600);
      const sortType = document.getElementById('shop-sort')?.value || 'featured';

      let list = AURA_PRODUCTS.filter(p => {
        const matchCategory = (selectedCategory === 'all' || p.category.toLowerCase() === selectedCategory.toLowerCase());
        const matchPrice = p.price <= maxPrice;
        return matchCategory && matchPrice;
      });

      if (sortType === 'price-low') list.sort((a, b) => a.price - b.price);
      else if (sortType === 'price-high') list.sort((a, b) => b.price - a.price);
      else if (sortType === 'rating') list.sort((a, b) => b.rating - a.rating);

      const container = document.getElementById('shop-products-grid');
      const countEl = document.getElementById('product-count');
      
      if (countEl) countEl.textContent = list.length;

      if (!container) return;

      if (list.length === 0) {
        container.innerHTML = `
          <div class="col-span-full py-20 text-center">
            <p class="font-serif text-2xl text-neutral-400 italic mb-2">No items match your filter</p>
            <p class="text-xs text-neutral-500">Try adjusting your price range or selecting another category.</p>
          </div>
        `;
        return;
      }

      container.innerHTML = list.map(product => {
        const isWished = (typeof State !== 'undefined' && State.isInWishlist) ? State.isInWishlist(product.id) : false;
        return `
          <div class="group relative flex flex-col bg-white border border-neutral-200/80 transition-all duration-300 hover:shadow-lg">
            <div class="relative w-full aspect-[3/4] overflow-hidden bg-neutral-100">
              <a href="product-details.html?id=${product.id}" class="block w-full h-full">
                <img 
                  src="${product.image}" 
                  alt="${product.name}" 
                  loading="lazy"
                  class="w-full h-full object-cover object-center group-hover:scale-105 transition-transform duration-700"
                />
              </a>

              <!-- Badges -->
              <div class="absolute top-3 left-3 flex flex-col gap-1 z-10 pointer-events-none">
                ${product.discount ? `<span class="bg-neutral-900 text-white text-[10px] tracking-widest font-semibold uppercase px-2.5 py-1 shadow-sm">${product.discount}</span>` : ''}
                ${product.isNew ? `<span class="bg-[#C5A880] text-white text-[10px] tracking-widest font-semibold uppercase px-2.5 py-1 shadow-sm">NEW</span>` : ''}
              </div>

              <!-- Wishlist Button -->
              <button 
                data-wishlist-btn="${product.id}"
                onclick="State.toggleWishlist('${product.id}')"
                title="Save to Wishlist"
                class="absolute top-3 right-3 z-10 w-9 h-9 rounded-full bg-white/95 backdrop-blur shadow-sm flex items-center justify-center hover:scale-110 transition-transform"
              >
                <svg xmlns="http://www.w3.org/2000/svg" class="w-4 h-4 ${isWished ? 'fill-rose-500 text-rose-500' : 'text-neutral-700'}" viewBox="0 0 24 24" stroke="currentColor" stroke-width="${isWished ? '0' : '1.8'}" fill="${isWished ? 'currentColor' : 'none'}">
                  <path stroke-linecap="round" stroke-linejoin="round" d="M4.318 6.318a4.5 4.5 0 000 6.364L12 20.364l7.682-7.682a4.5 4.5 0 00-6.364-6.364L12 7.636l-1.318-1.318a4.5 4.5 0 00-6.364 0z" />
                </svg>
              </button>

              <!-- Hover Action Buttons -->
              <div class="absolute inset-x-0 bottom-0 p-3 bg-gradient-to-t from-black/60 to-transparent opacity-0 group-hover:opacity-100 transition-opacity flex gap-2">
                <button 
                  onclick="openQuickView('${product.id}')" 
                  class="w-1/2 py-2.5 bg-white text-neutral-900 text-[11px] font-bold uppercase tracking-wider hover:bg-neutral-100 transition-colors shadow"
                >
                  Quick View
                </button>
                <button 
                  onclick="State.addToCart('${product.id}')" 
                  class="w-1/2 py-2.5 bg-neutral-900 text-white text-[11px] font-bold uppercase tracking-wider hover:bg-[#C5A880] transition-colors shadow"
                >
                  + Add to Bag
                </button>
              </div>
            </div>

            <!-- Card Content -->
            <div class="p-4 flex flex-col flex-grow justify-between bg-white">
              <div>
                <span class="text-[10px] uppercase tracking-widest text-[#C5A880] font-semibold">${product.category}</span>
                <h3 class="font-serif text-base text-neutral-900 mt-1 font-normal line-clamp-1 hover:text-[#C5A880] transition-colors">
                  <a href="product-details.html?id=${product.id}">${product.name}</a>
                </h3>
              </div>
              <div class="mt-3 flex items-center justify-between pt-2 border-t border-neutral-100">
                <div class="flex items-center gap-2">
                  <span class="text-sm font-semibold text-neutral-900">$${product.price.toFixed(2)}</span>
                  ${product.oldPrice ? `<span class="text-xs text-neutral-400 line-through">$${product.oldPrice.toFixed(2)}</span>` : ''}
                </div>
                <div class="flex items-center text-amber-500 text-xs gap-1">
                  <span>★</span>
                  <span class="text-neutral-500 text-[11px]">(${product.reviewsCount})</span>
                </div>
              </div>
            </div>
          </div>
        `;
      }).join('');
    }

    function resetFilters() {
      const allRadio = document.querySelector('input[name="shop-category"][value="all"]');
      if (allRadio) allRadio.checked = true;
      const slider = document.getElementById('price-range-slider');
      if (slider) slider.value = 600;
      const priceVal = document.getElementById('price-val');
      if (priceVal) priceVal.textContent = '600';
      const sortSelect = document.getElementById('shop-sort');
      if (sortSelect) sortSelect.value = 'featured';
      filterShop();
    }

    // Auto-run when DOM is fully loaded
    window.addEventListener('load', () => {
      const params = new URLSearchParams(window.location.search);
      const catParam = params.get('category');
      if (catParam) {
        const radio = document.querySelector(`input[name="shop-category"][value="${catParam}"]`);
        if (radio) radio.checked = true;
      }
      filterShop();
    });
  </script>
</body>
</html>
